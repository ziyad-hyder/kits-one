<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#10202A"/>

  <!-- faint oversized buffer ring, bleeding off the right edge -->
  <circle cx="1120" cy="315" r="340" fill="none" stroke="#17303B" stroke-width="60"/>
  <circle cx="1120" cy="315" r="340" fill="none" stroke="#244552" stroke-width="60"
    stroke-linecap="round" stroke-dasharray="640 2136" transform="rotate(-90 1120 315)"/>

  <!-- icon mark -->
  <g transform="translate(96,96)">
    <rect width="96" height="96" rx="19" fill="#152730"/>
    <circle cx="48" cy="48" r="33" fill="none" stroke="#22404C" stroke-width="12"/>
    <circle cx="48" cy="48" r="33" fill="none" stroke="#C9827D" stroke-width="12"
      stroke-linecap="round" stroke-dasharray="180 207.3" transform="rotate(-90 48 48)"/>
  </g>

  <!-- wordmark -->
  <text x="96" y="292" font-family="Inter, sans-serif" font-weight="800" font-size="88" fill="#EAEFF1">KITS One</text>

  <!-- tagline -->
  <text x="98" y="340" font-family="Inter, sans-serif" font-weight="400" font-size="30" fill="#5F8695">Academic companion for KITSW · URR24-R25 &amp; URR26</text>

  <!-- feature row -->
  <text x="98" y="410" font-family="Inter, sans-serif" font-weight="500" font-size="24" fill="#C4D5DA">Bunk Buffer</text>
  <circle cx="255" cy="403" r="3" fill="#5F8695"/>
  <text x="272" y="410" font-family="Inter, sans-serif" font-weight="500" font-size="24" fill="#C4D5DA">SGPA Calculator</text>
  <circle cx="486" cy="403" r="3" fill="#5F8695"/>
  <text x="503" y="410" font-family="Inter, sans-serif" font-weight="500" font-size="24" fill="#C4D5DA">ESE Planner</text>
  <circle cx="683" cy="403" r="3" fill="#5F8695"/>
  <text x="700" y="410" font-family="Inter, sans-serif" font-weight="500" font-size="24" fill="#C4D5DA">CGPA Converter</text>

  <!-- url -->
  <text x="96" y="560" font-family="IBM Plex Mono, monospace" font-weight="400" font-size="24" fill="#5CA3A6">ziyadhyder.dev/kits-one</text>
